name: Build Add Member Group Syndicate 411

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK 36
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract final project
        run: |
          test -f "AddMemberGroupSyndicate411_FINAL_Android13Plus_FIXED_READY.zip"
          rm -rf project
          mkdir project
          unzip -q "AddMemberGroupSyndicate411_FINAL_Android13Plus_FIXED_READY.zip" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Configure AndroidX
        run: |
          cd project
          grep -q "^android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "^android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        run: |
          cd project
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AddMemberGroupSyndicate411-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
